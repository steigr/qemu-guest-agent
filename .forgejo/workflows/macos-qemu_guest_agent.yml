# macos/qemu-guest-agent: builds the agent for PowerPC Mac OS X in the Panther guest beside the macosx-ppc runner,
# packages it as an Installer package, checks the package in the guest, and publishes package and stage twice: to
# this organisation's generic package registry (PACKAGE in macos/ci/component.sh, as <QGA_VERSION>.<run number> and
# latest), and to the verfuegbar publisher (updates.verfüg.bar/<PACKAGE>/), which keeps no appcast for it.
#
# The runner is a host runner with ssh to a PowerPC guest and a share both see. Where they are comes from Actions
# variables and secrets, so nothing about the infrastructure is in this repository:
#   vars.GUEST_SSH            user@host the runner reaches the guest as, with its own key
#   vars.SHARE_DIR            the share on the runner
#   vars.GUEST_SHARE          the same share in the guest
#   secrets.GUEST_PASSWORD    the guest account's password, for sudo (mkbom runs as root)
#   secrets.PUBLISHER_URL     the verfuegbar publisher's service
#   vars.PUBLISHER_AUDIENCE   the audience the publisher accepts
#
# Every token is the job's ID token, so no token is configured: vars.AUD is the audience of the Authorized
# Integration that uploads packages (write:package), and the publisher authorizes through its policy for this
# repository and workflow. libvsock is vendored in macos/transport/libvsock.
name: macos/qemu-guest-agent
on:
  push:
    branches: [main]
    paths: ["macos/**", "ci/**", ".forgejo/workflows/macos-qemu_guest_agent.yml"]
  workflow_dispatch:

enable-openid-connect: true

# One PowerPC guest: never build two components in it at once.
concurrency:
  group: macos-panther
  cancel-in-progress: false

jobs:
  build:
    runs-on: macosx-ppc
    timeout-minutes: 120
    env:
      GUEST_SSH: ${{ vars.GUEST_SSH }}
      SHARE_DIR: ${{ vars.SHARE_DIR }}
      GUEST_SHARE: ${{ vars.GUEST_SHARE }}
    steps:
      - name: Clone
        run: |
          set -eu
          rm -rf src
          git -c http.extraHeader="Authorization: bearer ${{ forgejo.token }}" \
            clone --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" src
          git -C src fetch --quiet --depth 1 origin "${{ forgejo.sha }}" && git -C src checkout --quiet FETCH_HEAD
          . src/macos/ci/component.sh
          sed -n 's/.*QGA_VERSION "\(.*\)".*/\1/p' src/macos/core/dispatch.h > version.txt
          [ -s version.txt ]
          echo "$PACKAGE $(cat version.txt), commit $(git -C src rev-parse --short HEAD)"

      - name: Build in the Panther guest
        run: |
          set -eu
          . src/macos/ci/component.sh
          for variant in $VARIANTS; do
            echo "::group::$variant"
            rm -rf payload
            mkdir -p payload/dl payload/deps
            cp -R src/macos "payload/$LAYOUT"
            LAYOUT="$LAYOUT" sh src/macos/ci/runner-app-build.sh "$variant" payload "stage-$variant"
            echo "::endgroup::"
          done
          ls -R stage-* | head -40

      - name: Package
        env:
          GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
        run: |
          set -eu
          . src/macos/ci/component.sh
          VERSION=$(cat version.txt)
          # Beside package.json: its scripts are relative to it.
          sed "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src/macos/ci/package.json > src/macos/ci/package.versioned.json
          rm -rf dist; mkdir -p dist
          for variant in $VARIANTS; do
            rm -rf "pkg-$variant"
            MKPKG_BOM_VIA="$PWD/src/macos/ci/guest-mkbom.sh" python3 src/macos/ci/mkpkg.py src/macos/ci/package.versioned.json --src "stage-$variant" --out "pkg-$variant"
            tar -C "pkg-$variant" -czf "dist/$PKG-$variant-$VERSION.pkg.tar.gz" "$PKG.pkg"
            tar -C "stage-$variant" -czf "dist/$PKG-$variant-$VERSION.stage.tar.gz" .
          done
          ls -l dist

      - name: Check the packages in the guest
        run: |
          job=check-$$
          mkdir -p "$SHARE_DIR/$job" && chmod 777 "$SHARE_DIR/$job"
          cp dist/*.pkg.tar.gz src/macos/ci/check-pkg.sh src/macos/ci/component.sh "$SHARE_DIR/$job/"
          chmod 644 "$SHARE_DIR/$job"/*
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o LogLevel=ERROR \
            "$GUEST_SSH" "sh -c 'sh $GUEST_SHARE/$job/check-pkg.sh $GUEST_SHARE/$job 2>&1; rc=\$?; rm -rf $GUEST_SHARE/$job; exit \$rc'"

      - name: Publish to the package registry
        env:
          AUD: ${{ vars.AUD }}
        run: |
          set -eu
          . src/macos/ci/component.sh
          version="$(cat version.txt).${{ forgejo.run_number }}"
          PACKAGES_JWT=$(curl --fail -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "::add-mask::$PACKAGES_JWT"
          export PACKAGES_JWT
          # The files carry QGA_VERSION; the registry's version adds the run number.
          sh src/ci/publish-package.sh "$PACKAGE" "$version" dist/*

  # The Intel releases' agent, on the runner beside the Snow Leopard guest (deploy/ci/git-stei-gr-macos-snowleopard.yaml
  # in steigr/qemu-vm-container-macos-guest), whose Xcode 3.2.6 builds `make intel`: one binary, i386 and x86_64, for
  # 10.4 to 10.15. After the PowerPC job, because that one replaces the package version and this one adds to it; then
  # verfüg.bar, once, with every file of the version. The same variables as the PowerPC job: both runners reach their
  # guest at the same address and share.
  intel:
    needs: build
    runs-on: macosx-intel
    timeout-minutes: 60
    env:
      GUEST_SSH: ${{ vars.GUEST_SSH }}
      SHARE_DIR: ${{ vars.SHARE_DIR }}
      GUEST_SHARE: ${{ vars.GUEST_SHARE }}
    steps:
      - name: Clone
        run: |
          set -eu
          rm -rf src
          git -c http.extraHeader="Authorization: bearer ${{ forgejo.token }}" \
            clone --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" src
          git -C src fetch --quiet --depth 1 origin "${{ forgejo.sha }}" && git -C src checkout --quiet FETCH_HEAD
          sed -n 's/.*QGA_VERSION "\(.*\)".*/\1/p' src/macos/core/dispatch.h > version.txt
          [ -s version.txt ]

      - name: Build in the Snow Leopard guest
        run: |
          set -eu
          . src/macos/ci/component.sh
          rm -rf payload stage-intel
          mkdir -p payload/dl payload/deps
          cp -R src/macos "payload/$LAYOUT"
          LAYOUT="$LAYOUT" sh src/macos/ci/runner-app-build.sh intel payload stage-intel
          { echo "qemu-guest-agent $(cat version.txt), make intel"
            echo "source: ${{ forgejo.repository }} ${{ forgejo.sha }}"
            cat stage-intel/BUILD-INFO; } > BUILD-INFO && mv BUILD-INFO stage-intel/BUILD-INFO
          cat stage-intel/BUILD-INFO

      - name: Package
        run: |
          set -eu
          . src/macos/ci/component.sh
          VERSION=$(cat version.txt)
          rm -rf dist; mkdir -p dist
          tar -C stage-intel -czf "dist/$PKG-intel-$VERSION.stage.tar.gz" .
          ls -l dist

      - name: Publish to the package registry, beside the PowerPC files
        env:
          AUD: ${{ vars.AUD }}
          ADD: "1"
        run: |
          set -eu
          . src/macos/ci/component.sh
          version="$(cat version.txt).${{ forgejo.run_number }}"
          PACKAGES_JWT=$(curl --fail -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "::add-mask::$PACKAGES_JWT"
          export PACKAGES_JWT
          sh src/ci/publish-package.sh "$PACKAGE" "$version" dist/*

      - name: Publish to verfüg.bar
        env:
          APPCAST: "false"
          AUD: ${{ vars.AUD }}
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
          PUBLISHER_AUDIENCE: ${{ vars.PUBLISHER_AUDIENCE }}
        run: |
          set -eu
          . src/macos/ci/component.sh
          VERSION=$(cat version.txt)
          version="$VERSION.${{ forgejo.run_number }}"
          PACKAGES_JWT=$(curl --fail -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "::add-mask::$PACKAGES_JWT"
          # The PowerPC files of this version, from the registry the job before put them in.
          for variant in $VARIANTS; do
            for kind in pkg stage; do
              f="$PKG-$variant-$VERSION.$kind.tar.gz"
              curl --fail -sS -H "Authorization: bearer $PACKAGES_JWT" -o "dist/$f" \
                "${{ forgejo.server_url }}/api/packages/${GITHUB_REPOSITORY%%/*}/generic/$PACKAGE/$version/$f"
            done
          done
          set -- dist/*.pkg.tar.gz dist/*.stage.tar.gz
          archive=$1; shift
          sh src/ci/publisher-client.sh "$PACKAGE" "$version" "$version" "$archive" "$@"
